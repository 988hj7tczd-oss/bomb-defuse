<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>拆弹大师</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a12;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  font-family: 'Arial Rounded MT Bold','Helvetica Rounded',Arial,sans-serif;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
}
#gameContainer {
  position: absolute;
  top: 0; left: 0;
  width: 520px;
  height: 720px;
  transform-origin: 0 0;
}
canvas {
  display: block;
  border-radius: 20px;
  box-shadow: 0 0 50px rgba(255,60,60,0.25), 0 8px 32px rgba(0,0,0,0.7);
  touch-action: none;
}
</style>
<style>
@font-face {
  font-family: 'DS-Digital';
  font-weight: 400;
  src: url('assets/DS-DIGI.woff') format('woff');
}
@font-face {
  font-family: 'DS-Digital';
  font-weight: 700;
  src: url('assets/DS-DIGIB.woff') format('woff');
}
#timerDisplay {
  position: absolute; top: 72px; left: 50%; transform: translateX(-50%);
  font-family: 'DS-Digital','Courier New',monospace;
  font-size: 56px;
  color: #ff2222;
  text-shadow: 0 0 12px rgba(255,0,0,0.8), 0 0 40px rgba(255,0,0,0.35);
  letter-spacing: 2px;
  z-index: 5; pointer-events: none;
  animation: pulse 1s ease-in-out infinite alternate;
  line-height: 1;
}
@keyframes pulse {
  from { text-shadow: 0 0 12px rgba(255,0,0,0.7), 0 0 30px rgba(255,0,0,0.3); }
  to   { text-shadow: 0 0 20px rgba(255,0,0,1), 0 0 50px rgba(255,0,0,0.6), 0 0 80px rgba(255,0,0,0.25); }
}
#hudProgress {
  position: absolute; top: 52px; left: 50%; transform: translateX(-50%);
  color: #ffcc44; font-size: 14px; font-weight: bold;
  text-shadow: 0 2px 8px rgba(0,0,0,0.9);
  background: rgba(0,0,0,0.5); padding: 2px 14px; border-radius: 10px;
  pointer-events: none; z-index: 5; backdrop-filter: blur(4px); white-space: nowrap;
}
#settingsBtn {
  position: absolute; top: 14px; left: 14px;
  width: 38px; height: 38px;
  background: rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  color: rgba(255,255,255,0.5);
  font-size: 19px;
  cursor: pointer;
  z-index: 10;
  display: none; align-items: center; justify-content: center;
  backdrop-filter: blur(4px);
  transition: background 0.2s, border-color 0.2s, color 0.2s;
  line-height: 1;
}
#settingsBtn:hover { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.3); color: #fff; }
#settingsPanel {
  position: absolute; inset: 0; z-index: 20;
  background: rgba(0,0,0,0.7);
  display: none; align-items: center; justify-content: center;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
#settingsBox {
  background: rgba(20,18,26,0.92);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 18px;
  padding: 30px 36px 24px;
  width: 260px;
  backdrop-filter: blur(10px);
}
#settingsBox h2 {
  color: #fff; font-size: 17px; font-weight: bold;
  text-align: center; margin-bottom: 22px; letter-spacing: 6px;
  opacity: 0.7;
}
.setRow {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
}
.setRow:last-of-type { border-bottom: none; }
.setRow label { color: rgba(255,255,255,0.6); font-size: 14px; }
.setRow button {
  width: 40px; height: 32px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  color: #fff; font-size: 16px;
  cursor: pointer; transition: background 0.2s;
  display: flex; align-items: center; justify-content: center;
}
.setRow button:hover { background: rgba(255,255,255,0.12); }
.setRow button.off { opacity: 0.35; }
.setRow input[type=range] {
  -webkit-appearance: none; appearance: none;
  width: 100px; height: 4px;
  background: rgba(255,255,255,0.15); border-radius: 2px;
  outline: none;
}
.setRow input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 14px; height: 14px;
  background: #ff4444; border-radius: 50%;
  cursor: pointer;
}
#setQuitBtn {
  margin-top: 18px; padding: 10px 0;
  background: rgba(200,30,30,0.2);
  border: 1px solid rgba(200,30,30,0.3);
  border-radius: 10px;
  color: rgba(255,80,80,0.8); font-size: 14px; font-weight: bold;
  text-align: center; cursor: pointer; letter-spacing: 4px;
  transition: background 0.2s;
}
#setQuitBtn:hover { background: rgba(200,30,30,0.35); color: #ff4444; }
#tutorialOverlay {
  display: none; position: absolute; inset: 0; z-index: 25;
  background: rgba(0,0,0,0.75);
  align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.35s ease;
}
#tutorialOverlay.show { display: flex; opacity: 1; }
#tutorialBox {
  background: rgba(20,18,26,0.95);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 18px; padding: 28px;
  width: 280px; backdrop-filter: blur(10px);
  text-align: center;
}
#tutorialBox h2 { color: #fff; font-size: 18px; margin-bottom: 16px; }
#tutorialBox p { color: rgba(255,255,255,0.78); font-size: 14px; line-height: 1.7; margin: 6px 0; text-align: left; }
#tutorialBox .hl { color: #ff5555; font-weight: bold; }
#tutorialBox .ok { color: #55dd77; font-weight: bold; }
#tutorialBtn {
  margin-top: 18px; padding: 11px 0; width: 100%;
  background: linear-gradient(180deg,#ee4455,#bb2233);
  border: none; border-radius: 12px;
  color: #fff; font-size: 16px; font-weight: bold;
  cursor: pointer; letter-spacing: 2px;
  box-shadow: 0 0 18px rgba(255,50,50,0.35);
  transition: transform 0.15s;
}
#tutorialBtn:hover { transform: scale(1.04); }
#victoryOverlay {
  display: none; position: absolute; inset: 0; z-index: 25;
  background: rgba(0,0,0,0.65);
  align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.4s ease;
}
#victoryOverlay.show { display: flex; opacity: 1; }
#victoryBox {
  background: rgba(20,18,26,0.95);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px; padding: 30px 28px 22px;
  width: 280px; backdrop-filter: blur(10px);
  text-align: center;
}
#victoryBox h2 { color: #ffdd44; font-size: 22px; margin-bottom: 6px; }
#victoryBox .sub { color: rgba(255,255,255,0.5); font-size: 13px; margin-bottom: 14px; }
#victoryBox .stars { color: #ffdd44; font-size: 15px; margin-bottom: 20px; }
#victoryBtnRow { display: flex; gap: 10px; }
#victoryBtnRow > div { flex: 1; padding: 11px 0; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; letter-spacing: 1px; transition: transform 0.15s, box-shadow 0.15s; }
#vicRetryBtn { background: linear-gradient(180deg,#ee4455,#bb2233); color: #fff; box-shadow: 0 0 14px rgba(255,50,50,0.3); }
#vicMenuBtn { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.1); }
#vicRetryBtn:hover { transform: scale(1.04); box-shadow: 0 0 22px rgba(255,50,50,0.5); }
#vicMenuBtn:hover { transform: scale(1.04); background: rgba(255,255,255,0.14); color: #fff; }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas"></canvas>
  <div id="timerDisplay" style="display:none">00.00</div>
  <div id="hudProgress" style="display:none">✂ 已剪断: 0/0 条双红线</div>
  <button id="settingsBtn" style="display:none" aria-label="设置">🔧</button>
  <div id="settingsPanel">
    <div id="settingsBox">
      <h2>设 置</h2>
      <div class="setRow"><label>静音</label><button id="setMuteBtn">🔊</button></div>
      <div class="setRow"><label>音量</label><input type="range" id="setVolume" min="0" max="100" value="100"></div>
      <div class="setRow"><label>震动</label><button id="setVibrateBtn">📳</button></div>
      <div class="setRow"><label>色盲模式</label><button id="setColorblindBtn">🎨</button></div>
      <div id="setQuitBtn">退 出 游 戏</div>
    </div>
  </div>
  <div id="tutorialOverlay">
    <div id="tutorialBox">
      <h2>🔍 拆弹规则</h2>
      <p>每条电线连接左右两个指示灯</p>
      <p><span class="hl">⚫⚫ 两端都是红灯（双红线）</span><br>→ 必须剪断</p>
      <p><span class="ok">⚫○ 有一边是绿灯</span><br>→ 不要剪，剪错会爆炸</p>
      <p>在时间内剪完所有双红线 → 过关</p>
      <div id="tutorialBtn">开始拆弹！</div>
    </div>
  </div>
  <div id="victoryOverlay">
    <div id="victoryBox">
      <h2>🏆 恭喜通关！</h2>
      <div class="sub">已完成全部 20 大关</div>
      <div class="stars">⭐ 总星数: <span id="vicStars">0</span> / 60</div>
      <div id="victoryBtnRow">
        <div id="vicRetryBtn">🔄 再来一次</div>
        <div id="vicMenuBtn">🏠 返回菜单</div>
      </div>
    </div>
  </div>
</div>
<script src="src/platform-browser.js"></script>
<script src="src/ui.js"></script>
<script src="src/game-core.js"></script>

</body>
</html>
